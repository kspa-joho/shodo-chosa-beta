<div id="app-header" class="app-header">
    <div class="header-top">
        <h1 class="app-title">被災状況調査アプリ</h1>
        <img src="{{LOGO_SRC}}" alt="AxA Logo" class="app-logo">
        <button id="fullwidth-btn" title="幅を広げる/戻す"
            style="background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4); color:white; padding:4px 10px; border-radius:4px; font-size:1rem; cursor:pointer; margin-left:8px; flex-shrink:0;"
            onclick="toggleFullWidth()">⛶</button>
    </div>
    <nav class="header-tabs">
        <button class="tab-btn" data-target="content-manage">管理</button>
        <button class="tab-btn active" data-target="content-app" style="display:flex; flex-direction:column; line-height:1.2;">
            <span>現地調査</span>
            <span id="tab-disaster-no" style="font-size:0.65rem; font-weight:normal; opacity:0.85;"></span>
        </button>
        <button class="tab-btn" data-target="content-dev">開発</button>
    </nav>
</div>
