<div class="survey-app-ui">
    <!-- 管理項目 -->
    <div class="accordion-item" data-group="num-mgmt">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">管理項目</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group"><label>会社ID</label><input type="text" name="company_id"></div>
            <div class="input-group"><label>調査班長名</label><input type="text" name="leader_name"></div>
            <div class="input-group"><label>整理番号</label><input type="text" name="ref_no"></div>
            <div class="input-group"><label>調査日</label><input type="date" name="survey_date" id="default-date"></div>
            <div class="input-group"><label>災害番号</label><input type="text" name="disaster_no"></div>
        </div>
    </div>

    <!-- 位置図 -->
    <div class="accordion-item" data-group="map-area">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">位置図</span><span class="summary-text empty">位置未設定</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content no-padding">
            <div class="map-mode-selector" style="display:flex; background:#444; color:white; font-size:0.8rem;">
                <label style="flex:1; padding:10px; text-align:center; border-right:1px solid #666;">
                    <input type="radio" name="map_mode" value="main" checked onchange="mapApp.setMode('main')"> メイン(位置)
                </label>
                <label style="flex:1; padding:10px; text-align:center;">
                    <input type="radio" name="map_mode" value="sub" onchange="mapApp.setMode('sub')"> サブ(落書き)
                </label>
            </div>
            <div id="map" style="height: 55vh; width: 100%;"></div>
            <div class="map-controls">
                <button type="button" onclick="mapApp.setCurrentLocation()">現在地</button>
                <button type="button" style="background:#e67e22; color:white;" onclick="mapApp.captureToPhoto()">地図を写真に保存</button>
                <button type="button" onclick="mapApp.clearLayers()">全て消去</button>
            </div>
        </div>
    </div>

    <!-- 諸元 -->
    <div class="accordion-item" data-group="base-info">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">諸元</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group"><label>所属名</label><input type="text" name="dept_name" placeholder="発注者名"></div>
            <div class="input-group"><label>被災場所</label><input type="text" name="loc_name" placeholder="住所等"></div>
            <div class="input-group"><label>路線・河川名等</label><input type="text" name="route_name"></div>
        </div>
    </div>

    <!-- 被災状況 -->
    <div class="accordion-item" data-group="damage-status">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">被災状況</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group"><label>被災日</label><input type="date" name="damage_date"></div>
            <div class="input-group"><label>延長 [m]</label><input type="number" step="0.1" name="length"></div>
            <div class="input-group"><label>高さ [m]</label><input type="number" step="0.1" name="height"></div>
            <div class="input-group">
                <label>岸別</label>
                <select name="side_type"><option value="none">選択...</option><option value="右岸">右岸</option><option value="左岸">左岸</option><option value="距離標なし">距離標なし</option></select>
            </div>
            <div class="input-group"><label>距離標・区間</label><input type="text" name="distance_label" placeholder="例：4k000"></div>
            <div class="input-group"><label>コメント</label><textarea name="comment" rows="3"></textarea></div>
        </div>
    </div>

    <!-- 被災拡大の可能性 -->
    <div class="accordion-item" data-group="expansion">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">被災拡大の可能性</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group">
                <label>有無</label>
                <select name="expansion_exists"><option value="none">選択...</option><option value="無">無</option><option value="有">有</option></select>
            </div>
            <div class="input-group"><label>状況</label><textarea name="expansion_status" rows="2"></textarea></div>
        </div>
    </div>

    <!-- 特記事項 -->
    <div class="accordion-item" data-group="special-notes">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">特記事項</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group">
                <label>有無</label>
                <select name="special_exists"><option value="none">選択...</option><option value="無">無</option><option value="有">有</option></select>
            </div>
            <div class="input-group"><label>状況</label><textarea name="special_status" rows="2"></textarea></div>
            <div class="input-group"><label>対策の概要</label><textarea name="plan_summary" rows="2"></textarea></div>
        </div>
    </div>

    <!-- 写真 -->
    <div class="accordion-item" data-group="photo-area">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">写真</span><span class="summary-text empty">0枚</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="photo-viewer">
                <div class="photo-nav">
                    <button type="button" onclick="photoApp.prev()">←</button>
                    <span id="photo-counter">0/0</span>
                    <button type="button" onclick="photoApp.next()">→</button>
                </div>
                <div id="photo-display" style="height: 200px; background: #333; margin: 5px 0; display: flex; align-items: center; justify-content: center;"></div>
                <div class="photo-tools" style="display:flex; gap:5px; margin-bottom:10px;">
                    <select id="photo-tag" style="flex:2;" onchange="photoApp.updateTag(this.value)">
                        <option value="補足">タグ: 補足</option>
                        <option value="全景">タグ: 全景</option>
                        <option value="近景">タグ: 近景</option>
                        <option value="地図メモ">タグ: 地図メモ</option>
                    </select>
                    <button type="button" class="btn-sub" style="flex:1; background:#e74c3c;" onclick="photoApp.delete()">削除</button>
                </div>
                <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="photoApp.handleFile(this)">
                <button type="button" class="btn-main" onclick="document.getElementById('photo-input').click()">写真を追加・撮影</button>
                <div class="input-group"><label>写真の備考</label><textarea id="photo-memo" rows="2" oninput="photoApp.updateMemo(this.value)"></textarea></div>
            </div>
        </div>
    </div>

    <!-- 調査を実施した者 -->
    <div class="accordion-item" data-group="surveyor-info">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">調査を実施した者</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group"><label>会社名</label><input type="text" name="company_name"></div>
            <div class="input-group"><label>電話番号</label><input type="tel" name="tel" class="validate-tel"></div>
            <div class="input-group"><label>FAX番号</label><input type="tel" name="fax" class="validate-tel"></div>
            <div class="input-group"><label>職氏名</label><input type="text" name="person_name"></div>
            <div class="input-group"><label>E-mail</label><input type="email" name="email"></div>
        </div>
    </div>

    <!-- 入出力 -->
    <div class="accordion-item" data-group="io-area">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">入出力</span><span class="summary-text">データ操作</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="filename-builder" style="background:#eee; padding:10px; margin-bottom:10px; border-radius:4px;">
                <label style="font-size:0.7rem; color:#666;">出力ファイル名構成</label>
                <div style="display:flex; gap:2px; margin-top:5px;">
                    <!-- 5つのプルダウン全てに全項目を網羅 -->
                    <select class="fn-part" id="fn1">
                        <option value="survey_date">調査日</option><option value="company_id">会社ID</option><option value="leader_name">班長</option><option value="ref_no">整理番号</option><option value="disaster_no">災害番号</option><option value="none">なし</option>
                    </select>
                    <select class="fn-part" id="fn2">
                        <option value="survey_date">調査日</option><option value="company_id">会社ID</option><option value="leader_name">班長</option><option value="ref_no">整理番号</option><option value="disaster_no" selected>災害番号</option><option value="none">なし</option>
                    </select>
                    <select class="fn-part" id="fn3">
                        <option value="survey_date">調査日</option><option value="company_id">会社ID</option><option value="leader_name">班長</option><option value="ref_no">整理番号</option><option value="disaster_no">災害番号</option><option value="none" selected>なし</option>
                    </select>
                    <select class="fn-part" id="fn4">
                        <option value="survey_date">調査日</option><option value="company_id">会社ID</option><option value="leader_name">班長</option><option value="ref_no">整理番号</option><option value="disaster_no">災害番号</option><option value="none" selected>なし</option>
                    </select>
                    <select class="fn-part" id="fn5">
                        <option value="survey_date">調査日</option><option value="company_id">会社ID</option><option value="leader_name">班長</option><option value="ref_no">整理番号</option><option value="disaster_no">災害番号</option><option value="none" selected>なし</option>
                    </select>
                </div>
            </div>
            <button type="button" class="btn-main" onclick="appControl.exportZip()">入力データ保存（JZIP形式）</button>
            <input type="file" id="import-jzip" accept=".zip" style="display:none" onchange="appControl.importZip(this)">
            <button type="button" class="btn-sub" onclick="document.getElementById('import-jzip').click()" style="margin-bottom:10px;">JZIP読み込み</button>
            <button type="button" class="btn-sub" onclick="appControl.exportCSV()" style="margin-bottom:10px;">日報用CSVエクスポート（写真なし）</button>
            <hr style="margin: 15px 0;">
            <button type="button" class="btn-sub" style="background:#e67e22;" onclick="appControl.exportCurrentApp()">この内容を初期値として保存（html）</button>
        </div>
    </div>
</div>
