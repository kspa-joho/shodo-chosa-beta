<div class="survey-app-ui">
    <!-- 位置図 -->
    <div class="accordion-item" data-group="map-area">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">位置図</span><span class="summary-text empty">位置未設定</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content no-padding">
            <!-- GPS修正モードバナー（通常時は非表示） -->
            <div id="gps-fix-banner" style="display:none; background:#e74c3c; color:white; padding:10px 15px; align-items:center; justify-content:space-between; font-size:0.85rem; font-weight:bold;">
                <span>📍 位置情報を修正する場所をタップしてください</span>
                <button type="button"
                    style="background:rgba(255,255,255,0.25); border:1px solid white; color:white; padding:4px 12px; border-radius:4px; font-size:0.8rem; cursor:pointer;"
                    onclick="mapApp.cancelGpsFixMode(); photoApp._restorePhotoTab();">キャンセル</button>
            </div>
            <!-- モード切替：メイン・サブ・白紙メモの3モード -->
            <div style="display:flex; background:#444; color:white; font-size:0.8rem;">
                <button id="mode-btn-map" class="sketch-btn active"
                    style="flex:1; padding:10px; border:none; border-right:1px solid #666; color:white; font-size:0.8rem;"
                    onclick="uiHelper.switchMapMode('map')">メイン(位置)</button>
                <button id="mode-btn-draw" class="sketch-btn"
                    style="flex:1; padding:10px; border:none; border-right:1px solid #666; color:white; font-size:0.8rem;"
                    onclick="uiHelper.switchMapMode('draw')">サブ(落書き)</button>
                <button id="mode-btn-sketch" class="sketch-btn"
                    style="flex:1; padding:10px; border:none; color:white; font-size:0.8rem;"
                    onclick="uiHelper.switchMapMode('sketch')">白紙メモ</button>
            </div>
            <!-- 地図エリア -->
            <div id="map-container">
                <div id="map"></div>
                <div class="map-controls">
                    <button type="button" onclick="mapApp.setCurrentLocation()">現在地</button>
                    <button type="button" style="background:#e67e22; color:white;" onclick="mapApp.captureToPhoto()">地図を写真に保存</button>
                    <button type="button" onclick="mapApp.clearLayers()">全て消去</button>
                </div>
            </div>
            <!-- 白紙メモエリア -->
            <div id="sketch-container" style="display:none;">
                <div class="sketch-toolbar">
                    <div class="sketch-tool-group">
                        <button id="sk-free"   class="sketch-btn active" onclick="sketchApp.setTool('free')">ペン</button>
                        <button id="sk-line"   class="sketch-btn"        onclick="sketchApp.setTool('line')">線</button>
                        <button id="sk-text"   class="sketch-btn"        onclick="sketchApp.setTool('text')">文字</button>
                        <button id="sk-edit"   class="sketch-btn"        onclick="sketchApp.setTool('edit')">編集</button>
                    </div>
                    <div class="sketch-tool-group">
                        <select id="sketch-color-select" class="sketch-btn" style="color:black;" onchange="sketchApp.setColor(this.value)" title="ペンの色"><option value="black" style="color:black;" selected>● 黒</option><option value="red" style="color:red;">● 赤</option><option value="blue" style="color:blue;">● 青</option><option value="#008000" style="color:#008000;">● 緑</option><option value="#ff8c00" style="color:#ff8c00;">● オレンジ</option><option value="#800080" style="color:#800080;">● 紫</option><option value="#8b4513" style="color:#8b4513;">● 茶</option><option value="#ff1493" style="color:#ff1493;">● ピンク</option><option value="#00a0c8" style="color:#00a0c8;">● 水色</option><option value="#808080" style="color:#808080;">● グレー</option><option value="#b8a000" style="color:#b8a000;">● 黄土</option><option value="#006400" style="color:#006400;">● 濃緑</option></select>
                    </div>
                    <div class="sketch-tool-group">
                        <button class="sketch-btn" onclick="sketchApp.undo()">戻る</button>
                    </div>
                </div>
                <div class="sketch-canvas-container">
                    <canvas id="sketch-canvas" class="sketch-canvas"></canvas>
                    <!-- 文字要素を選択中に表示する浮動ツールバー（回転・編集・削除） -->
                    <!-- 連続線を描いている間だけ表示する完了・中止ボタン -->
                    <div id="sketch-line-toolbar" style="display:none; position:absolute; top:8px; right:8px; background:white; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.3); padding:6px; gap:6px; z-index:50; align-items:center;">
                        <button type="button" class="btn-sub" style="width:auto; padding:4px 10px; font-size:0.8rem; background:#e74c3c;" onclick="sketchApp.cancelPolyline()">中止</button>
                        <button type="button" class="btn-main" style="width:auto; padding:4px 10px; font-size:0.8rem;" onclick="sketchApp.finishPolyline()">完了</button>
                    </div>
                    <div id="sketch-text-toolbar" style="display:none; position:absolute; background:white; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,0.3); padding:4px 8px; gap:6px; z-index:50; align-items:center;">
                        <button id="sk-tb-rotate-l" type="button" onclick="sketchApp.rotateSelected(-15)" style="border:none;background:none;font-size:1.1rem;cursor:pointer;">↺</button>
                        <button id="sk-tb-rotate-r" type="button" onclick="sketchApp.rotateSelected(15)" style="border:none;background:none;font-size:1.1rem;cursor:pointer;">↻</button>
                        <button id="sk-tb-edit" type="button" onclick="sketchApp.editSelectedText()" style="border:none;background:none;font-size:1.1rem;cursor:pointer;">✏️</button>
                        <button id="sk-tb-delpoint" type="button" onclick="sketchApp.deleteSelectedPoint()" style="border:none;background:none;font-size:1.1rem;cursor:pointer;" title="この点だけ削除">✂️</button>
                        <button id="sk-tb-delete" type="button" onclick="sketchApp.deleteSelected()" style="border:none;background:none;font-size:1.1rem;cursor:pointer;" title="要素ごと削除">🗑</button>
                    </div>
                </div>
                <!-- 文字入力モーダル（複数行対応。従来のprompt()に代わるもの） -->
                <div id="sketch-text-modal" class="custom-modal-overlay">
                    <div class="custom-modal-box">
                        <div class="custom-modal-title">文字を入力</div>
                        <textarea id="sketch-text-textarea" rows="3"
                            style="width:100%; box-sizing:border-box; padding:8px; border:1px solid #ccc; border-radius:4px; font-size:1rem;"></textarea>
                        <div class="custom-modal-actions">
                            <button type="button" class="btn-sub" onclick="sketchApp.cancelTextModal()">キャンセル</button>
                            <button type="button" class="btn-main" style="width:auto; padding:8px 16px;" onclick="sketchApp.confirmTextModal()">確定</button>
                        </div>
                    </div>
                </div>
                <div style="display:flex; gap:5px; padding:5px;">
                    <button class="btn-sub" style="flex:1; background:#c0392b;" onclick="sketchApp.clearAll()">全消去</button>
                    <button class="btn-main" style="flex:1;" onclick="sketchApp.saveToPhoto()">写真に保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 諸元 -->
    <div class="accordion-item" data-group="base-info">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">諸元</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <!-- 発注者名は管理タブで入力。値があるときのみ表示（readonly）。 -->
            <div class="input-group" id="dept-name-display" style="display:none;">
                <label>発注者名 <span style="font-size:0.7rem; color:#aaa;">※管理タブで設定</span></label>
                <input type="text" id="dept-name-readonly" readonly
                    style="background:#f0f0f0; color:#555; cursor:not-allowed;">
            </div>
            <div class="input-group"><label>被災場所</label><input type="text" name="loc_name" placeholder="住所等"></div>
            <div class="input-group"><label>路線・河川名等</label><input type="text" name="route_name"></div>
        </div>
    </div>

    <!-- 被災状況 -->
    <div class="accordion-item" data-group="damage-status">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">被災状況</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group"><label>被災日</label><input type="date" name="damage_date"></div>
            <div class="input-group"><label>延長 [m]</label><input type="number" step="0.1" name="length"></div>
            <div class="input-group"><label>高さ [m]</label><input type="number" step="0.1" name="height"></div>
            <div class="input-group">
                <label>岸別</label>
                <select name="side_type"><option value="none">選択...</option><option value="右岸">右岸</option><option value="左岸">左岸</option><option value="距離標なし">距離標なし</option></select>
            </div>
            <div class="input-group"><label>距離標・区間</label><input type="text" name="distance_label" placeholder="例：4k000"></div>
            <div class="input-group"><label>コメント</label><textarea name="comment" rows="3"></textarea></div>
        </div>
    </div>

    <!-- 被災拡大の可能性 -->
    <div class="accordion-item" data-group="expansion">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">被災拡大の可能性</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group">
                <label>有無</label>
                <select name="expansion_exists"><option value="none">選択...</option><option value="無">無</option><option value="有">有</option></select>
            </div>
            <div class="input-group"><label>状況</label><textarea name="expansion_status" rows="2"></textarea></div>
        </div>
    </div>

    <!-- 特記事項 -->
    <div class="accordion-item" data-group="special-notes">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">特記事項</span><span class="summary-text empty">未入力</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="input-group">
                <label>有無</label>
                <select name="special_exists"><option value="none">選択...</option><option value="無">無</option><option value="有">有</option></select>
            </div>
            <div class="input-group"><label>状況</label><textarea name="special_status" rows="2"></textarea></div>
            <div class="input-group"><label>対策の概要</label><textarea name="plan_summary" rows="2"></textarea></div>
        </div>
    </div>

    <!-- 写真 -->
    <div class="accordion-item" data-group="photo-area">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">写真</span><span class="summary-text empty">0枚</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <div class="photo-viewer">

                <!-- ナビゲーション -->
                <div class="photo-nav">
                    <button type="button" onclick="photoApp.prev()">← 前の写真</button>
                    <span id="photo-counter">0/0</span>
                    <button type="button" onclick="photoApp.next()">次の写真 →</button>
                </div>

                <!-- プレビューエリア -->
                <div id="photo-display" style="height:200px; background:#333; margin:5px 0; display:flex; align-items:center; justify-content:center;"></div>

                <!-- タグ・削除 -->
                <div class="photo-tools" style="display:flex; gap:5px; margin-bottom:8px;">
                    <select id="photo-tag" style="flex:2;" onchange="photoApp.updateTag(this.value)">
                        <option value="補足">タグ: 補足</option>
                        <option value="全景">タグ: 全景</option>
                        <option value="近景">タグ: 近景</option>
                        <option value="地図メモ">タグ: 地図メモ</option>
                    </select>
                    <button type="button" class="btn-sub" style="flex:1; background:#e74c3c;" onclick="photoApp.delete()">削除</button>
                </div>

                <!-- 【iPhone対応】inputを2つに分離。
                     photo-camera-input: capture="environment"・multipleなし → カメラ直起動専用。
                     photo-file-input: captureなし・multiple あり → ファイル選択専用（複数枚対応）。
                     changeリスナーはDOMContentLoaded内でaddEventListenerで登録する（iOS対応）。 -->
                <input type="file" id="photo-camera-input" accept="image/*" capture="environment" style="display:none">
                <input type="file" id="photo-file-input" accept="image/*" multiple style="display:none">

                <div style="display:flex; gap:6px; margin-bottom:8px;">
                    <button type="button" id="photo-camera-btn" class="btn-main" style="flex:1; background:#2c3e50;"
                        onclick="document.getElementById('photo-camera-input').click()">
                        📷 撮影（GPS準備中）
                    </button>
                    <button type="button" class="btn-sub" style="flex:1;"
                        onclick="document.getElementById('photo-file-input').click()">
                        📁 ファイル選択
                    </button>
                </div>

                <!-- 写真の備考 -->
                <div class="input-group">
                    <label>写真の備考</label>
                    <textarea id="photo-memo" rows="2" oninput="photoApp.updateMemo(this.value)"></textarea>
                </div>

                <!-- センサー情報エリア（方位・GPS） -->
                <div style="background:#f0f4f8; border:1px solid #dde3ea; border-radius:4px; padding:10px; margin-bottom:8px;">

                    <!-- GPS・方位の使い方（任意項目である旨・磁気センサー非搭載時の代替手段）を折りたたみで表示 -->
                    <div style="margin-bottom:8px;">
                        <span style="font-size:0.75rem; color:#3498db; cursor:pointer; text-decoration:underline;"
                            onclick="uiHelper.toggleSensorInfo()">ⓘ GPS・方位の使い方</span>
                        <div id="sensor-info-text" style="display:none; font-size:0.72rem; color:#666; background:#fffbe6; border:1px solid #f0e6b3; border-radius:4px; padding:6px 8px; margin-top:4px; line-height:1.5;">
                            GPS・方位はどちらも任意項目です（未入力でも調査に支障はありません）。<br>
                            ・GPS：端末のGPS機能を使用します。電波状況により取得に時間がかかったり、取得できない場合があります。<br>
                            ・方位：端末に磁気センサー（コンパス）が無い場合は自動取得できません。その場合は「撮影方向」欄に数値を直接入力してください（目安：北=0° 東=90° 南=180° 西=270°）。
                        </div>
                    </div>

                    <!-- リアルタイム方位 -->
                    <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
                        <span style="font-size:0.78rem; color:#666; white-space:nowrap;">🧭 現在の方位：</span>
                        <span id="azimuth-live" style="font-size:0.82rem; font-weight:bold; color:#aaa;">--</span>
                    </div>

                    <!-- 撮影方向（記録値） -->
                    <div style="display:flex; align-items:center; gap:5px; margin-bottom:10px;">
                        <label style="font-size:0.78rem; color:#666; white-space:nowrap; min-width:5em;">撮影方向：</label>
                        <input type="number" id="photo-azimuth-input" min="0" max="359" placeholder="未記録"
                            style="width:72px; padding:5px; border:1px solid #ccc; border-radius:4px; font-size:0.9rem;"
                            oninput="photoApp.updateAzimuth(this.value)">
                        <span id="photo-azimuth-dir" style="font-size:0.82rem; color:#3498db; min-width:3em;"></span>
                        <button type="button" class="btn-main" style="flex:1; padding:6px; font-size:0.78rem; background:#2c3e50;"
                            onclick="photoApp.recordAzimuth()">記録</button>
                        <button type="button" class="btn-sub" style="flex:1; padding:6px; font-size:0.78rem; background:#e74c3c;"
                            onclick="photoApp.clearAzimuth()">削除</button>
                    </div>

                    <!-- リアルタイムGPS -->
                    <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
                        <span style="font-size:0.78rem; color:#666; white-space:nowrap;">📍 現在のGPS：</span>
                        <span id="gps-live" style="font-size:0.82rem; font-weight:bold; color:#aaa;">--</span>
                    </div>

                    <!-- 位置情報（○m / 修正済み / 不明 / 未取得） -->
                    <div style="display:flex; align-items:center; gap:5px;">
                        <label style="font-size:0.78rem; color:#666; white-space:nowrap; min-width:5em;">位置情報：</label>
                        <span id="photo-gps-status" style="flex:1; font-size:0.82rem; font-weight:bold; color:#aaa;">未取得</span>
                        <button type="button" class="btn-main" style="flex:1; padding:6px; font-size:0.78rem; background:#2c3e50;"
                            onclick="photoApp.modifyGps()">修正</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 保存（Phase 6.16：現場データの上書き保存・別名保存。JZIPの入出力は現場管理タブへ移動） -->
    <div class="accordion-item" data-group="io-area">
        <button class="accordion-header">
            <div class="header-label"><span class="main-title">保存</span><span class="summary-text filled" id="save-status-summary">保存済み</span></div>
            <span class="icon">+</span>
        </button>
        <div class="accordion-content">
            <button type="button" class="btn-main" style="margin-bottom:8px;" onclick="siteManager.overwriteSave()">上書き保存</button>
            <button type="button" class="btn-sub" style="margin-bottom:10px;" onclick="siteManager.saveAsNew()">別名保存</button>
            <hr style="margin: 15px 0;">
            <button type="button" class="btn-sub" onclick="appControl.exportCSV()">日報用CSVエクスポート（写真なし）</button>
        </div>
    </div>
</div>
