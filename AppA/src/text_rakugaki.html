<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>白紙メモ V2 (ツール付き)</title>
    <style>
        body { margin: 0; padding: 10px; background: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; touch-action: none; }
        
        /* ツールバー */
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 5px; width: 100%; max-width: 500px; margin-bottom: 5px;
            background: #fff; padding: 5px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .tool-group { display: flex; gap: 2px; border-right: 1px solid #ddd; padding-right: 5px; margin-right: 5px; }
        .tool-group:last-child { border: none; }
        
        button {
            padding: 8px 12px; border: 1px solid #ccc; background: #f9f9f9; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        button.active { background: #3498db; color: white; border-color: #2980b9; }
        
        /* 色選択 */
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.3); padding: 0; }
        .color-btn.active { transform: scale(1.2); border-color: #333; }

        /* キャンバス */
        .canvas-container { position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.2); background: white; cursor: crosshair; }
        canvas { display: block; }
        
        /* アクションボタン */
        .actions { margin-top: 10px; display: flex; gap: 10px; width: 100%; max-width: 500px; }
        .btn-act { flex: 1; padding: 10px; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="toolbar">
        <!-- ツール -->
        <div class="tool-group">
            <button class="tool-btn active" onclick="sketchApp.setTool('free')" id="btn-free">ペン</button>
            <button class="tool-btn" onclick="sketchApp.setTool('line')" id="btn-line">直線</button>
            <button class="tool-btn" onclick="sketchApp.setTool('text')" id="btn-text">文字</button>
            <button class="tool-btn" onclick="sketchApp.setTool('eraser')" id="btn-eraser">消ゴム</button>
        </div>
        <!-- 色 -->
        <div class="tool-group" style="align-items: center;">
            <button class="color-btn active" style="background:black;" onclick="sketchApp.setColor('black', this)"></button>
            <button class="color-btn" style="background:red;" onclick="sketchApp.setColor('red', this)"></button>
            <button class="color-btn" style="background:blue;" onclick="sketchApp.setColor('blue', this)"></button>
        </div>
        <!-- 履歴 -->
        <div class="tool-group">
            <button onclick="sketchApp.undo()">戻る</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="main-canvas"></canvas>
    </div>

    <div class="actions">
        <button class="btn-act" style="background:#c0392b;" onclick="sketchApp.clearAll()">全消去</button>
        <button class="btn-act" style="background:#27ae60;" onclick="sketchApp.save()">保存</button>
    </div>

    <script>
        const sketchApp = {
            canvas: null, ctx: null,
            isDrawing: false,
            startX: 0, startY: 0,
            mode: 'free', // free, line, text, eraser
            color: 'black',
            lineWidth: 3,
            history: [], // Undo用
            snapshot: null, // 直線描画中のプレビュー用

            init() {
                this.canvas = document.getElementById('main-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                // サイズ調整 (スマホ幅に合わせる)
                const w = Math.min(document.body.clientWidth - 20, 500);
                this.canvas.width = w;
                this.canvas.height = w * 1.2; // A4比率っぽく
                
                // 背景白塗り (透過防止)
                this.clearCanvas();

                // イベント
                const start = (e) => this.start(this.getPos(e));
                const move = (e) => this.move(this.getPos(e));
                const end = () => this.end();

                this.canvas.addEventListener('mousedown', start);
                this.canvas.addEventListener('mousemove', move);
                this.canvas.addEventListener('mouseup', end);
                
                this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e.touches[0]); }, {passive:false});
                this.canvas.addEventListener('touchmove', (e) => { e.preventDefault(); move(e.touches[0]); }, {passive:false});
                this.canvas.addEventListener('touchend', end);
            },

            getPos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            },

            setTool(t) {
                this.mode = t;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('btn-' + t).classList.add('active');
            },

            setColor(c, btn) {
                this.color = c;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (this.mode === 'eraser') this.setTool('free'); // 色変えたらペンに戻す
            },

            saveState() {
                // Undo用に現在の画像を保存 (最大10回分とかに制限すべきだが簡易実装)
                this.history.push(this.canvas.toDataURL());
            },

            undo() {
                if (this.history.length === 0) return;
                const prevData = this.history.pop();
                const img = new Image();
                img.src = prevData;
                img.onload = () => {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    this.ctx.drawImage(img, 0, 0);
                }
            },

            start(pos) {
                if (this.mode === 'text') {
                    this.addText(pos);
                    return;
                }
                this.isDrawing = true;
                this.startX = pos.x;
                this.startY = pos.y;
                this.saveState(); // 書き始める前の状態を保存

                this.ctx.beginPath();
                this.ctx.moveTo(pos.x, pos.y);
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                
                if (this.mode === 'eraser') {
                    this.ctx.strokeStyle = '#ffffff';
                    this.ctx.lineWidth = 20;
                } else {
                    this.ctx.strokeStyle = this.color;
                    this.ctx.lineWidth = 3;
                }

                // 直線の場合は現在の画面を記憶（ドラッグ中のプレビュー用）
                if (this.mode === 'line') {
                    this.snapshot = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                }
            },

            move(pos) {
                if (!this.isDrawing) return;

                if (this.mode === 'line') {
                    // 直前の状態に戻してから新しい線を引く（ゴム紐描画）
                    this.ctx.putImageData(this.snapshot, 0, 0);
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.startX, this.startY);
                    this.ctx.lineTo(pos.x, pos.y);
                    this.ctx.stroke();
                } else {
                    // フリーハンド & 消しゴム
                    this.ctx.lineTo(pos.x, pos.y);
                    this.ctx.stroke();
                }
            },

            end() {
                this.isDrawing = false;
            },

            addText(pos) {
                const text = prompt("文字を入力してください:", "");
                if (text) {
                    this.saveState();
                    this.ctx.fillStyle = this.color;
                    this.ctx.font = "bold 16px sans-serif";
                    this.ctx.fillText(text, pos.x, pos.y);
                }
            },

            clearCanvas() {
                this.ctx.fillStyle = "white";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            },

            clearAll() {
                if (confirm("全消去しますか？")) {
                    this.saveState();
                    this.clearCanvas();
                }
            },

            save() {
                const dataUrl = this.canvas.toDataURL('image/jpeg');
                // ここで本来は photoApp に渡す処理が入る
                const w = window.open("");
                w.document.write("<img src='" + dataUrl + "'/>");
            }
        };

        window.onload = () => sketchApp.init();
    </script>
</body>
</html>
